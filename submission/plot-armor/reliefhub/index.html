<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReliefHub — Flood Relief Coordination</title>
  <meta name="description" content="ReliefHub coordinates flood relief for 8 camps across Sindh — camps, inventory, needs, dispatches, donations and volunteers in one live operations dashboard.">
  <meta name="theme-color" content="#052a1f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d5c46'/%3E%3Cpath d='M32 14c5 6 12 10 12 19a12 12 0 0 1-24 0c0-9 7-13 12-19z' fill='%2334d399'/%3E%3Cpath d='M32 26v14M26 32h12' stroke='%23052a1f' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="icon" type="image/jpeg" href="assets/images/logo-mark.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="assets/images/logo-mark.jpg" alt="ReliefHub logo" width="38" height="38"
             onerror="this.style.display='none'">
        <div>
          <div class="brand-name">ReliefHub</div>
          <div class="brand-sub">Flood Relief Coordination</div>
        </div>
      </div>
      <label class="role-switch">
        <span>Viewing as</span>
        <select id="role-select">
          <option value="coordinator">Relief Coordinator (Admin)</option>
          <option value="volunteer">Field Volunteer</option>
        </select>
      </label>
      <nav id="main-nav" class="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot">
        <div>Sindh Flood Response · 2026</div>
        <div class="media-credit">Media: Unsplash — Salah Darwish, Jeff Ackley, Khalil Radi, CHUTTERSNAP, jhosel rodriguez, Joel Muniz, Nico Smit, Hannah Busing</div>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- Load order matters: framework first, modules register themselves, app boots on load -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/modules/camps.js"></script>
  <script src="js/modules/inventory.js"></script>
  <script src="js/modules/needs.js"></script>
  <script src="js/modules/dispatches.js"></script>
  <script src="js/modules/donations.js"></script>
  <script src="js/modules/volunteers.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/priority.js"></script>
  <script src="js/modules/opsmap.js"></script>
  <script src="js/modules/simulator.js"></script>
  <script src="js/modules/opsfeed.js"></script>
</body>
</html>
