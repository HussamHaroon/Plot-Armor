# =============================================================================
# AWS Integration (Bonus — Milestone 8 of issue #2)
# -----------------------------------------------------------------------------
# Documented extension of the security pipeline: how an APPROVED build flows
# into AWS. This file is intentionally inert documentation (it lives outside
# .github/workflows/ so GitHub never executes it). To activate, copy to
# .github/workflows/, fill in the repo variables, and provision the secrets.
#
# Flow:  security gate passes  ->  image pushed to Amazon ECR
#        ->  Amazon Inspector scans the pushed image
#        ->  only approved images deploy  ->  reports archived to S3
#
# Prerequisites (least-privilege by design):
#   OIDC identity provider between this repo and AWS IAM (no long-lived keys):
#     aws iam create-open-id-connect-provider \
#       --url https://token.actions.githubusercontent.com --client-id-list sts.amazonaws.com
#   An IAM role (e.g. plot-armor-cicd) trusted by the repo, allowing only:
#     ecr:GetAuthorizationToken, ecr:PutImage on the specific repo ARN,
#     inspector:ListFindings / inspector:DescribeFindings (or inspector2:*scan*),
#     s3:PutObject on the reports prefix.
#   Secrets/variables: AWS_ROLE_ARN, ECR_REGISTRY, ECR_REPO, S3_REPORTS_BUCKET
#   S3 bucket: versioning ON, public access blocked, SSE-S3 encryption.
# =============================================================================

